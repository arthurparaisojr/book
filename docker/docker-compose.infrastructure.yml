services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: book-sqlserver
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${BOOK_SQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ../database:/workspace/database:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\" -C"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver-data:
